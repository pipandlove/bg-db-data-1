# Checks a pull request that adds matches, with the tools of pipandlove/bgdb at v11 (decision 0024).
# Its result is the check "validate / validate" on the pull request; review-publish runs after it.
name: validate
on:
  pull_request:
    paths: ['inbox/**']
permissions:
  contents: read
jobs:
  validate:
    uses: pipandlove/bgdb/.github/workflows/data-validate.yml@v11
    with:
      tools-repository: pipandlove/bgdb
      tools-ref: v11
    secrets: inherit

# "Submit a match" issues become pull requests. Set the secret BGDB_BOT_TOKEN so that "validate" runs on them (docs/contributing-flow.md in bgdb).
name: issue-to-pr
on:
  issues:
    types: [opened, edited]
permissions:
  contents: write
  pull-requests: write
  issues: write
concurrency:
  group: issue-${{ github.event.issue.number }}
  cancel-in-progress: true
jobs:
  convert:
    uses: pipandlove/bgdb/.github/workflows/data-issue-to-pr.yml@v10
    with:
      tools-repository: pipandlove/bgdb
      tools-ref: v10
    secrets: inherit
